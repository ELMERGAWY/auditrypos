name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/manager-sync/**'
      - 'supabase/functions/social-oauth/**'
      - 'supabase/functions/social-ads/**'
      - 'supabase/functions/social-publish/**'
      - 'supabase/functions/social-publish-worker/**'
      - 'supabase/functions/crm-social-webhooks/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      deploy_marketing:
        description: 'Deploy the active marketing OAuth, publishing, ads, and CRM webhook functions'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-production-functions
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets and production target
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done
          if [[ "$SUPABASE_PROJECT_ID" != "uwdjijaqawnlcoyaorcr" ]]; then
            echo "Refusing to deploy: unexpected production project ref" >&2
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Meta and publishing runtime secrets
        shell: bash
        env:
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          SOCIAL_PUBLISH_WORKER_SECRET: ${{ secrets.SOCIAL_PUBLISH_WORKER_SECRET }}
          OAUTH_ALLOWED_REDIRECT_ORIGINS: ${{ secrets.OAUTH_ALLOWED_REDIRECT_ORIGINS }}
        run: |
          set -euo pipefail
          for name in META_WEBHOOK_VERIFY_TOKEN SOCIAL_PUBLISH_WORKER_SECRET OAUTH_ALLOWED_REDIRECT_ORIGINS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub production secret: $name" >&2
              exit 1
            fi
          done
          secret_file=$(mktemp)
          trap 'rm -f "$secret_file"' EXIT
          umask 077
          printf 'META_WEBHOOK_VERIFY_TOKEN=%s\nSOCIAL_PUBLISH_WORKER_SECRET=%s\nOAUTH_ALLOWED_REDIRECT_ORIGINS=%s\n' \
            "$META_WEBHOOK_VERIFY_TOKEN" \
            "$SOCIAL_PUBLISH_WORKER_SECRET" \
            "$OAUTH_ALLOWED_REDIRECT_ORIGINS" > "$secret_file"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" --env-file "$secret_file"

      - name: Deploy active Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            manager-sync
            social-oauth
            social-ads
            social-publish
            social-publish-worker
            crm-social-webhooks
          )
          for function_name in "${functions[@]}"; do
            if [[ ! -f "supabase/functions/${function_name}/index.ts" ]]; then
              echo "Missing function entrypoint: ${function_name}" >&2
              exit 1
            fi
            echo "Deploying ${function_name} to ${SUPABASE_PROJECT_ID}"
            supabase functions deploy "$function_name" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --no-verify-jwt
          done

      - name: Confirm deployment target
        run: |
          echo "Active Edge Functions deployment and runtime secret sync completed for Supabase project $SUPABASE_PROJECT_ID"
          echo "Runtime secret values are supplied through GitHub Environment Secrets and are never stored in source files or logs."
          echo "The application functions enforce their own authenticated/secret gates; gateway JWT verification remains disabled for webhook and worker callbacks."
